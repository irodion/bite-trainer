name: CI

# Runs on pushes to main and on pull requests. Deliberately `pull_request`, never `pull_request_target`: a PR from a
# fork runs with a read-only token and no secrets, and (repository setting) waits for a maintainer's approval first.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository: its GitHub token can not push or comment. The one job that publishes is
# `deploy`, and it does so with a Cloudflare token, never with GitHub permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer commit supersedes a pull request's run; a run on main is left to finish so a deploy is never cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

env:
  # The compiler the official Pack's Claims were verified with; error codes and messages can shift between releases.
  RUST_TOOLCHAIN: 1.94.1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify

  verify-pack:
    name: verify-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - run: pnpm verify-pack

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: app/test-results
          retention-days: 7

  # Publishes main to https://bite-trainer.pages.dev — only for a push to main, and only after every check passed.
  # A pull request never reaches this job, so it never sees the secret. Wrangler is run through pnpm at a pinned
  # version because the repository allows GitHub-owned actions only.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, verify-pack, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      WRANGLER_VERSION: 4.135.0
      CLOUDFLARE_ACCOUNT_ID: 2243832672581996ae28bc97f250d914 # an identifier, not a credential
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >
          pnpm dlx "wrangler@$WRANGLER_VERSION" pages deploy dist
          --project-name bite-trainer --branch main
          --commit-hash "$GITHUB_SHA" --commit-dirty=false
